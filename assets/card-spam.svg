ansform attributeName="transform" type="translate" values="200 168;200 168;200 52;200 52" keyTimes="0;0.69;0.79;1" dur="7s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.69;0.79;0.83;1" dur="7s" repeatCount="indefinite" /><g transform="rotate(-90)" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round"><g><line x1="-12" y1="-5" x2="16" y2="6"/><circle cx="-17" cy="-7" r="5"/><animateTransform attributeName="transform" type="rotate" values="-16;4;-16" dur=".35s" repeatCount="indefinite"/></g><g><line x1="-12" y1="5" x2="16" y2="-6"/><circle cx="-17" cy="7" r="5"/><animateTransform attributeName="transform" type="rotate" values="16;-4;16" dur=".35s" repeatCount="indefinite"/></g></g></g><rect x="128" y="178" width="144" height="34" rx="8" fill="#18213d" stroke="#2a3558" stroke-width="1.5"/><text x="200" y="200" font-size="12" fill="#8792a8" text-anchor="middle">inbox</text>
