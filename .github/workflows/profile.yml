name: Rebuild commit city and character sheet

on:
  schedule:
    - cron: "17 3 * * *" # once a day
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Redraw city.svg and character.svg from GitHub data
        run: python3 scripts/build_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Commit the images if they changed
        run: |
          if git diff --quiet -- assets/city.svg assets/character.svg; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city.svg assets/character.svg
          git commit -m "chore: rebuild commit city"
          git push
